name: CI

# Safety net: build the frontend and syntax-check the backend on every PR (and
# on pushes to main) so a change that won't compile can't auto-deploy to the
# live event. Railway deploys on merge to main with no gate of its own, so this
# is the only thing standing between a broken merge and production.
#
# To make this actually BLOCK a merge (not just show a red X), enable branch
# protection on `main` → "Require status checks to pass" → select
# "Frontend build", "Backend syntax", "Python unit tests" and "Consistency checks".

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Barista Front End"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "Barista Front End/package-lock.json"
      - name: Install dependencies
        # Fall back to `npm install` if the lockfile is out of sync, so a stale
        # lock doesn't wedge every PR.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Build
        # CI=false: the codebase has many pre-existing lint warnings; with CI=true
        # CRA treats warnings as errors and every build would fail. A real compile
        # error (missing import, bad JSX, etc.) still fails the build — which is
        # exactly the breakage we want to catch.
        run: CI=false npm run build
      - name: Unit tests
        # Blocking since the suite went green (Oct 2026): a red test now means
        # a real regression, not a stale test.
        run: CI=true npm test -- --watchAll=false --passWithNoTests

  backend:
    name: Backend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax check (live code)
        # Bytecode-compiles the live backend (skips _archive*/backup dirs). Catches
        # syntax errors that would crash the app on boot — the backend equivalent
        # of the frontend build failing.
        run: python -m compileall -q app.py auth.py config.py routes services models utils

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        # tests/unit needs no database. (test_sms_conversation_flow.py talks to
        # a real Postgres, so it runs locally, not here.)
        env:
          TESTING_MODE: "True"
        run: python -m pytest -q tests/unit

  routes:
    name: One handler per address
    # Builds the real app against a throwaway Postgres and fails if two
    # handlers share a method and address (roadmap X7-10).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          TESTING_MODE: "True"
          JWT_SECRET_KEY: ci-only-not-a-secret
          SECRET_KEY: ci-only-not-a-secret
        run: python scripts/check_route_shadowing.py

  event-freeze:
    name: Event freeze
    # Fails while cupq.app is serving an event or the organiser has frozen
    # updates (Runner > Settings), so nothing new goes live mid-event
    # (roadmap S1-4). Emergency fix: label the PR freeze-override.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Is cupq.app frozen?
        env:
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'freeze-override') }}
        run: |
          code=$(curl -s -o freeze.json -w '%{http_code}' -A CupQ-CI https://cupq.app/api/public/release-freeze || echo 000)
          echo "HTTP $code: $(cat freeze.json 2>/dev/null)"
          if [ "$code" = "404" ]; then echo "cupq.app predates the freeze check; not blocking."; exit 0; fi
          # cupq.app not answering at all (17-20 Oct 2026: its database pool
          # was empty, the freeze check returned 503 and blocked the very fix
          # that ended the outage). If its menu fails too, it can't be serving
          # an event: let the fix through, loudly.
          case "$code" in 5*|000)
            menu=$(curl -s -o /dev/null -m 20 -w '%{http_code}' -A CupQ-CI https://cupq.app/api/display/menu || echo 000)
            if [ "$menu" != "200" ]; then
              echo "::warning::cupq.app is down (freeze check HTTP $code, menu HTTP $menu), so it isn't serving an event. Not blocking: this may be the fix."
              exit 0
            fi;;
          esac
          frozen=$(python3 -c "import json;print(json.load(open('freeze.json')).get('frozen', True))" 2>/dev/null || echo True)
          if [ "$frozen" = "False" ]; then echo "Not frozen."; exit 0; fi
          if [ "$OVERRIDE" = "true" ]; then echo "::warning::Frozen, but the PR is labelled freeze-override."; exit 0; fi
          echo "::error::cupq.app is frozen for an event. Wait until it's over, or label the PR freeze-override for an emergency fix."
          exit 1

  consistency:
    name: Consistency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared-state consistency guardrails
        # Static greps for the recurring "two views of the same fact disagree"
        # bug class (e.g. station status via the phantom is_active field, or the
        # public display reading auth-gated settings). See the script header.
        run: bash scripts/ci_consistency_checks.sh

  audit:
    name: Dependency audit (informational)
    # Reports known-vulnerable packages; doesn't block. Triage and upgrade
    # plan: docs/DEPENDENCY_AUDIT.md.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 20
      - name: Frontend (npm audit, runtime deps)
        if: always()
        working-directory: "Barista Front End"
        run: npm audit --omit=dev --audit-level=critical
