     Coffee Cue — EventsAir attendee app
     Static Content module -> HTML item -> Open HTML Editor -> Tools ->
     Source code. Paste this, replacing everything.

     Embeds /my full-screen INSIDE the app, the same way other events
     embed their ePosters app. Better than a link: no new tab to lose,
     and an attendee can come back to watch their order.

     /my asks once who they are (mobile number, or badge number), then
     shows their usual with a single Order button, or live status while
     a coffee is being made.

     Deliberately byte-for-byte the same SHAPE as the ePosters embed that

     exactly like a blocked iframe.

     Verified from a foreign origin: /my renders inside a cross-origin
     iframe, so the server side is not the constraint. The server permits
     framing for the anonymous attendee pages only (/my, /order, /how,
     /display, /sign); staff screens refuse on purpose.

     If it is still blank after pasting: reopen Tools -> Source code and
     check what was actually SAVED. If the iframe tag is gone or altered,

     =================================================================== -->
