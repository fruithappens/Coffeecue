<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- viewport-fit=cover lets the page fill a notched iPhone instead of
         being letterboxed inside an app webview; the safe areas are then
         handled in CSS with env(safe-area-inset-*). Matched to what the
         ePosters app (which works in the EventsAir app) declares.

         Deliberately NOT copying its user-scalable=no / maximum-scale=1:
         those stop someone pinch-zooming, which is a real accessibility
         loss for anyone who needs to enlarge text to read a coffee menu.
         The reason people usually add them is to stop iOS zooming when an
         input is focused, and that only happens below 16px — our inputs
         are larger, so we get the benefit without the cost. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C08552" />
    <meta
      name="description"
      content="CupQ - Skip the Queue, Get Your Cue"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>CupQ</title>

    <!-- Coffee Cue Sound System (audio chime when new orders arrive) -->
    <script src="%PUBLIC_URL%/coffee-sounds.js"></script>

    <!-- Display Scaling CSS / Helper (only used by the customer /display screen) -->
    <link rel="stylesheet" href="%PUBLIC_URL%/display-scaling.css">
    <script src="%PUBLIC_URL%/display-helper.js"></script>

    <!--
      Removed in cleanup-20260605 (kept in public/_archive/cleanup-20260605/):
        - fix-localstorage.js — runtime localStorage patch, redundant in prod
        - auto-test.js — automated UI test harness, should NEVER be in prod
        - disable-websocket.js conditional — debug-only kill switch
        - inline localStorage.setItem coffee_system_config with apiBaseUrl='http://localhost:5001/api'
          (ConfigService.js overrides this with '/api' in NODE_ENV=production,
          so it was dead config — but the fresh-eyes audit flagged it as
          alarming and confusing in DevTools. Gone.)
        - inline 'use_fallback_data: false' write (set elsewhere if needed)
    -->

    <script>
      // Apply branding from localStorage if available — sets the
      // document title before the React shell mounts so the tab
      // shows "Coffee Cue at Hills Baptist Lobethal" instead of
      // the default "Coffee Cue Ordering System". Wrapped in
      // try/catch because branding may be missing or malformed.
      try {
        const branding = localStorage.getItem('coffee_system_branding');
        if (branding) {
          const brandingConfig = JSON.parse(branding);
          if (brandingConfig.landingTitle) {
            document.title = brandingConfig.landingTitle;
          }
        }
      } catch (e) {
        // Branding read failed — leave the default title. Not fatal.
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Blank-screen reporter.
         A white page tells you nothing. On a phone inside an event app
         there is no console, no dev tools and no way for the person
         holding it to say anything more useful than "it's not working" —
         which is exactly where we ended up.

         This paints the actual error onto the page, and separately
         reports a page that loaded HTML but never rendered anything. It
         runs BEFORE the bundle, so it also catches a bundle that fails
         to parse or execute at all. Inline on purpose: an external file
         cannot report its own failure to load. -->
    <script>
      (function () {
        var reported = false;
        function show(kind, detail) {
          if (reported) return;
          reported = true;
          try {
            var el = document.getElementById('root');
            if (!el) return;
            el.innerHTML =
              '<div style="font:16px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;'
              + 'padding:24px;max-width:640px;margin:0 auto;color:#111">'
              + '<h2 style="margin:0 0 8px;font-size:20px">Coffee Cue could not start</h2>'
              + '<p style="margin:0 0 16px;color:#555">Please show this to the organiser.</p>'
              + '<pre style="white-space:pre-wrap;word-break:break-word;background:#f4f4f5;'
              + 'border:1px solid #ddd;border-radius:8px;padding:12px;font-size:13px">'
              + kind + '\n' + detail + '\n\n' + navigator.userAgent
              + '\nframed: ' + (window.top !== window.self) + '</pre></div>';
          } catch (e) { /* nothing further we can do */ }
        }
        window.addEventListener('error', function (e) {
          // A failed IMAGE, SCRIPT or STYLESHEET also fires this event, and
          // it is NOT the app failing to start. A QR image that could not
          // load on venue wifi was enough to replace a perfectly working
          // display board with "Coffee Cue could not start".
          if (e && e.target && e.target !== window && e.target.tagName) return;
          // Opaque cross-origin errors arrive as bare "Script error." with
          // no file and no line. They carry nothing actionable and are
          // almost always a third-party resource, not our bundle.
          if (e && e.message && /^Script error\.?$/i.test(e.message) && !e.filename) return;
          // Once the app has rendered, it plainly DID start. A later error
          // must not blank the screen mid-service.
          var rootEl = document.getElementById('root');
          if (rootEl && rootEl.children.length > 0) return;
          show('Script error', (e && (e.message || e.type)) + ' @ '
            + ((e && e.filename) || '?') + ':' + ((e && e.lineno) || '?'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          // Same rule: a rejected fetch after the app is up is a network
          // blip to handle in the UI, not a reason to blank the board.
          var rootEl = document.getElementById('root');
          if (rootEl && rootEl.children.length > 0) return;
          show('Unhandled promise rejection',
            String((e && e.reason && (e.reason.message || e.reason)) || e));
        });
        // Nothing rendered after a generous wait: the bundle never ran, or
        // ran and produced nothing. Either way the person sees WHY.
        setTimeout(function () {
          var el = document.getElementById('root');
          if (el && el.children.length === 0) {
            show('The page loaded but nothing rendered',
              'The app bundle did not start. This usually means it was '
              + 'blocked from loading, or storage/cookies are restricted here.');
          }
        }, 8000);
      })();
    </script>
  </body>
</html>
