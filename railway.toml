# NOTE: this repo carries BOTH railway.json and railway.toml. Railway reads
# one of them, and which one wins is not obvious from here — so keep the
# deploy settings IDENTICAL in both.
#
# healthcheckPath was added here on 2026-08-18 and REVERTED the same day:
# production stopped serving entirely (TLS handshake fine, no HTTP response)
# and did not recover on its own. The app itself was proven healthy — it
# boots and answers /api/health 200 locally on the exact merged commit — so
# the healthcheck config is the only remaining variable. Do not re-add it
# without watching the Railway deploy logs live.
[build]
builder = "dockerfile"

[deploy]
startCommand = "python run_server.py"
restartPolicyType = "ON_FAILURE"
